name: Radar daily
on:
  schedule:
    - cron: "17 5 * * *"   # каждый день ~08:17 по Москве
  workflow_dispatch: {}     # кнопка "Run workflow" для ручного запуска
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Собрать чарты Apple
        run: python3 radar.py collect
      - name: Собрать страницу
        run: |
          python3 radar.py build
          mkdir -p _site
          cp site/Main.dc.html _site/index.html
          cp site/support.js _site/support.js
      - name: Сохранить базу
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar.db
          git commit -m "snapshot $(date -u +%F)" || echo "нечего сохранять"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
